services:
  - type: web
    name: reverse-cast-web
    runtime: static
    buildCommand: node --check web-cast/app.mjs
    staticPublishPath: ./web-cast
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
